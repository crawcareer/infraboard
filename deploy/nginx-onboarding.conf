# Example nginx reverse proxy config for the Infradapt Onboarding Tracker.
# Copy to /etc/nginx/sites-available/onboarding, adjust server_name, then:
#   ln -s /etc/nginx/sites-available/onboarding /etc/nginx/sites-enabled/onboarding
#   nginx -t && systemctl reload nginx
#
# Run `certbot --nginx -d onboarding.yourcompany.com` afterwards to add TLS
# (see README.md for details).

server {
    listen 80;
    server_name onboarding.yourcompany.com;

    client_max_body_size 25M;

    access_log /var/log/nginx/onboarding.access.log;
    error_log  /var/log/nginx/onboarding.error.log;

    location /static/ {
        alias /opt/onboarding-app/app/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
