{% extends "base.html" %}
{% block title %}{{ 'Edit template' if template else 'New template' }}{% endblock %}
{% block content %}
<h2>{{ 'Edit template' if template else 'New template' }}</h2>
<div class="card mt-3">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" value="{{ template.name if template else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" class="form-control" name="description" value="{{ template.description if template else '' }}">
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('templates_admin.list_templates') }}" class="btn btn-link">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
